<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JellyFish Light — Backgammon</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="window"><header class="titlebar"><img src="assets/bitmap-LOGOU-1044.png" alt="">JellyFish Light 3.5 <span>Backgammon</span></header>
<nav aria-label="Menu"><details><summary>Game</summary><div><button data-action="new">New game / match…</button><button data-action="save">Save game…</button><button data-action="load">Open game…</button><button data-action="print">Print position</button><button data-action="exportLog">Export game log…</button></div></details><details><summary>Play</summary><div><button data-action="roll">Roll dice</button><button data-action="undo">Undo move</button><button data-action="finish">Pick up dice</button><button data-action="double">Double</button><button data-action="swap">Swap dice</button><button data-action="back">Takeback</button><button data-action="forward">Step forward</button><button data-action="resign">Resign…</button></div></details><details><summary>View</summary><div><button data-action="hint">Hint</button><button data-action="evaluate">Evaluate position</button><button data-action="best">Best moves</button><button data-action="rollout">Rollout…</button><button data-action="statistics">Statistics…</button><button data-action="edit">Edit position…</button><button data-action="settings">Settings…</button><button data-action="flip">Reverse board</button></div></details><details><summary>Help</summary><div><button data-action="help">How to play</button><button data-action="about">About JellyFish</button></div></details></nav>
<div class="toolbar"><button data-action="new" title="New match">New</button><button data-action="roll" id="roll">Roll dice</button><button data-action="undo" id="undo">Undo</button><button data-action="finish" id="finish">Pick up dice</button><i></i><button data-action="double" id="double">Double</button><button data-action="hint" id="hint">Hint</button><button data-action="settings">Settings</button></div>
<section class="scoreboard"><div><b class="white-dot"></b><strong id="human-name">You</strong> <span id="human-score">0</span><small id="human-pips"></small></div><div id="match-info">7 point match</div><div><b class="black-dot"></b><strong id="computer-name">JellyFish</strong> <span id="computer-score">0</span><small id="computer-pips"></small></div></section>
<div class="board-wrap"><svg id="board" viewBox="0 0 1000 680" role="group" aria-label="Backgammon board"></svg></div>
<section class="turnbar"><div id="dice" aria-label="Dice"></div><p id="instruction" aria-live="polite"></p><button id="next-game" data-action="next" hidden>Next game</button></section>
<details class="log"><summary>Game log</summary><ol id="log"></ol></details><footer><span id="status" role="status" aria-live="polite">Ready</span><span id="engine-status" role="status">Loading evaluator…</span></footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-buttons"></div></form></dialog><input id="file" type="file" accept="application/json,.json" hidden><script type="module" src="src/app.js"></script></body></html>
