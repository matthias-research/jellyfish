<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JellyFish Light — Backgammon</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="window"><header class="titlebar"><img src="assets/jellyfish-logo.png" alt="">JellyFish Light 3.5 <span>Backgammon</span></header>
<nav aria-label="Menu"><details name="main-menu"><summary>Game</summary><div><button data-action="new">New game / match… <kbd>F2</kbd></button><button data-action="save">Save game… <kbd>Ctrl+S</kbd></button><button data-action="load">Open game… <kbd>Ctrl+O</kbd></button><button data-action="print">Print position</button><button data-action="exportLog">Export game log…</button></div></details><details name="main-menu"><summary>Play</summary><div><button data-action="roll">Roll dice <kbd>Ctrl+R</kbd></button><button data-action="undo">Undo move <kbd>Ctrl+Z</kbd></button><button data-action="finish">Pick up dice <kbd>Space</kbd></button><button data-action="double">Double <kbd>Ctrl+D</kbd></button><button data-action="swap">Swap dice <kbd>Ctrl+W</kbd></button><button data-action="back">Takeback <kbd>Ctrl+K</kbd></button><button data-action="forward">Step forward <kbd>Ctrl+T</kbd></button><button data-action="finishGame" title="Finish game automatically (Ctrl+A)">Finish game</button><button data-action="resign">Resign…</button></div></details><details name="main-menu"><summary>View</summary><div><button data-action="hint">Hint</button><button data-action="evaluate">Evaluate position <kbd>Ctrl+E</kbd></button><button data-action="best">Best moves <kbd>Ctrl+B</kbd></button><button data-action="rollout">Rollout…</button><button data-action="statistics">Statistics… <kbd>F4</kbd></button><button data-action="edit">Edit position…</button><button data-action="settings">Settings… <kbd>F9</kbd></button><button data-action="flip">Reverse board</button></div></details><details name="main-menu"><summary>Help</summary><div><button data-action="help">How to play</button><button data-action="about">About JellyFish</button></div></details></nav>
<div class="toolbar"><button data-action="new" title="New match">New</button><button data-action="roll" id="roll">Roll dice</button><button data-action="undo" id="undo">Undo</button><button data-action="finish" id="finish">Pick up dice</button><i></i><button data-action="double" id="double">Double</button><button data-action="hint" id="hint">Hint</button><button data-action="finishGame" id="finish-game" title="Finish game automatically (Ctrl+A)">Finish game</button><button data-action="settings">Settings</button><button id="horizontal-layout">Horizontal</button></div>
<section class="scoreboard"><div><b class="white-dot"></b><strong id="human-name">You</strong> <span id="human-score">0</span><small id="human-pips"></small></div><div id="match-info">7 point match</div><div><b class="black-dot"></b><strong id="computer-name">JellyFish</strong> <span id="computer-score">0</span><small id="computer-pips"></small></div></section>
<section class="evaluation" aria-label="Position evaluation" title="Estimated chance of winning this game from the checker position and side to move. Does not account for the current dice, cube value, gammon points, or match score.">
<div class="evaluation-labels"><span id="eval-white">White —</span><small id="eval-status">Loading evaluation…</small><span id="eval-black">Black —</span></div>
<div id="evaluation-bar" role="meter" aria-label="White estimated game win probability" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading evaluation" aria-busy="true"><div id="evaluation-white"></div><i></i></div>
</section>
<aside class="horizontal-controls" aria-label="Horizontal layout controls" hidden>
<div id="compact-human" aria-label="Your score and pips"></div>
<div class="horizontal-buttons"><button id="compact-double" data-action="double">Double</button><button id="compact-undo" data-action="undo">Undo</button><button id="compact-hint" data-action="hint">Hint</button><button id="compact-finish-game" data-action="finishGame" title="Finish game automatically (Ctrl+A)">Finish game</button><button id="vertical-layout">Vertical</button><button id="toggle-fullscreen" aria-pressed="false">Fullscreen</button></div>
<output class="move-score" id="compact-quality" aria-label="Move assessment" aria-live="polite"></output>
<div id="compact-computer" aria-label="Opponent score and pips"></div>
</aside><div class="board-wrap"><svg id="board" viewBox="0 0 1000 680" role="group" aria-label="Backgammon board"></svg></div>
<section class="turnbar"><output id="vertical-quality" class="move-score" aria-label="Move assessment" aria-live="polite"></output><p aria-live="polite"><span id="move-rank"></span><span id="instruction"></span></p><button id="next-game" data-action="next" hidden>Next game</button></section>
<details class="log"><summary>Game log</summary><ol id="log"></ol></details><footer><span id="status" role="status" aria-live="polite">Ready</span><span id="engine-status" role="status">Loading evaluator…</span></footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-buttons"></div></form></dialog><input id="file" type="file" accept="application/json,.json" hidden><script type="module" src="src/app.js"></script></body></html>
